name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole gate on SQLite: front-end lint and format, tsc, Pint,
  # PHPStan level 8 and Pest (docs/architecture.md §11).
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
        env:
          # Vitest boots vite.config.ts, and laravel-vite-plugin refuses to
          # start under CI=true because it takes it for an HMR dev server.
          # Vitest serves nothing; the plugin is needed for the `@/` alias.
          LARAVEL_BYPASS_ENV_CHECK: '1'

  # The Pest suite again on PostgreSQL 17, the production engine (ADR 006).
  pgsql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: elifba
          POSTGRES_USER: elifba
          POSTGRES_PASSWORD: elifba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elifba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: intl, pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # phpunit.xml forces in-memory SQLite over DB_*; ELIFBA_TEST_PGSQL_URL is
      # the one opt-in (tests/bootstrap.php), and DatabaseEngineTest fails if
      # the suite is not on pgsql.
      - name: Run Pest on PostgreSQL
        run: php artisan test
        env:
          ELIFBA_TEST_PGSQL_URL: pgsql://elifba:elifba@127.0.0.1:5432/elifba

      # The same proof from outside PHP: the service database is empty until
      # the suite migrates it, so no `migrations` table means it never ran here.
      - name: Fail unless the suite ran on PostgreSQL
        run: |
          applied=$(docker exec "$PG_CONTAINER" psql -U elifba -d elifba -tAc 'select count(*) from migrations')
          echo "Migrations the suite applied on PostgreSQL: $applied"
          test "$applied" -gt 0
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}

  # The Docker stack from a clean checkout (docs/architecture.md §10):
  # build, every service healthy, /up and the assets through Caddy, Reverb's
  # WebSocket through it and its HTTP API not, the scheduler, a backup, and
  # data surviving `down` and `up`.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the stack
        run: scripts/docker-smoke.sh
        env:
          ELIFBA_SMOKE_DOWN: '1'

      # The same image, with the profile `voice` (docs/architecture.md §10 "Live voice").
      - name: Check the stack with live voice
        run: scripts/docker-smoke.sh
        env:
          ELIFBA_SMOKE_VOICE: '1'
          ELIFBA_SMOKE_BUILD: '0'
          ELIFBA_SMOKE_DOWN: '1'
