<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90">
  <!-- The dinosaurs pack's backdrop: a prehistoric valley with soft hills, ferns and a distant volcano, and no dinosaur or egg (a child counts the pictures on the tiles). Elifba own art, MIT. -->
  <!-- 16:9 and low contrast so tiles stay readable: the colours of ADR 014's guide mixed with white, no outline, light from the top left; the valley floor stays in the bottom fifth (y 66–90). -->
  <defs>
    <linearGradient id="vadi_sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F6F8"/><stop offset="0.78" stop-color="#FBFDF7"/></linearGradient>
    <radialGradient id="vadi_glow2" cx="0.08" cy="0" r="0.62"><stop offset="0" stop-color="#FFFBE0" stop-opacity="0.88"/><stop offset="1" stop-color="#FFFBE0" stop-opacity="0"/></radialGradient>
    <linearGradient id="vadi_cloud3" x1="0" y1="0" x2="0" y2="1"><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.92"/><stop offset="1" stop-color="#E7E3F5" stop-opacity="0.82"/></linearGradient>
    <filter id="vadi_blur035" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="0.35"/></filter>
    <radialGradient id="vadi_volcano4" cx="0.35" cy="0.2" r="0.9"><stop stop-color="#E5DCE8"/><stop offset="0.55" stop-color="#D5CADC"/><stop offset="1" stop-color="#C2B5CD"/></radialGradient>
    <radialGradient id="vadi_lava5" cx="0.5" cy="0.2" r="0.8"><stop stop-color="#FFE3B8"/><stop offset="0.5" stop-color="#FFC7A6"/><stop offset="1" stop-color="#F3ACA4"/></radialGradient>
    <linearGradient id="vadi_plume6" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#DDD6E6" stop-opacity="0.75"/><stop offset="1" stop-color="#F6F3FA" stop-opacity="0.2"/></linearGradient>
    <radialGradient id="vadi_hill7" cx="0.3" cy="0.1" r="1"><stop stop-color="#F1FCE0"/><stop offset="0.5" stop-color="#E3F0D4"/><stop offset="1" stop-color="#D6E6C4"/></radialGradient>
    <radialGradient id="vadi_hill8" cx="0.3" cy="0.1" r="1"><stop stop-color="#E9F9D2"/><stop offset="0.5" stop-color="#D4E8BE"/><stop offset="1" stop-color="#C4DCA8"/></radialGradient>
