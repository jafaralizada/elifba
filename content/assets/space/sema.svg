    <radialGradient id="sema_hill2" cx="0.3" cy="0.1" r="1"><stop stop-color="#E8E4F8"/><stop offset="0.55" stop-color="#D6CFF0"/><stop offset="1" stop-color="#C2B8E4"/></radialGradient>
    <radialGradient id="sema_hill3" cx="0.3" cy="0.1" r="1"><stop stop-color="#DDD6F3"/><stop offset="0.55" stop-color="#C8BFE8"/><stop offset="1" stop-color="#B4A8DC"/></radialGradient>
  </defs>
  <rect width="160" height="90" fill="url(#sema_sky1)"/>
