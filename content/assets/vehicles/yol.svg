    <radialGradient id="vyol_hill2" cx="0.3" cy="0.1" r="1"><stop stop-color="#EEF9DB"/><stop offset="0.55" stop-color="#DCECC6"/><stop offset="1" stop-color="#CBE0B0"/></radialGradient>
    <radialGradient id="vyol_road3" cx="0.5" cy="0.2" r="0.9"><stop stop-color="#E4E1EC"/><stop offset="1" stop-color="#CEC9DC"/></radialGradient>
